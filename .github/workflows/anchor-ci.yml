name: Anchor build and tests

on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: anchor-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build Anchor program and run LiteSVM tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: solana-pci
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust 1.89.0
        uses: dtolnay/rust-toolchain@1.89.0

      - name: Install Solana CLI 4.1.2
        shell: bash
        run: |
          sh -c "$(curl --proto '=https' --tlsv1.2 -sSfL https://release.anza.xyz/v4.1.2/install)"
          SOLANA_BIN="$HOME/.local/share/solana/install/active_release/bin"
          echo "$SOLANA_BIN" >> "$GITHUB_PATH"
          export PATH="$SOLANA_BIN:$PATH"
          command -v solana
          solana --version

      - name: Install Anchor CLI 1.2.2
        run: cargo install --git https://github.com/otter-sec/anchor --tag v1.2.2 anchor-cli --locked

      - name: Install cargo-build-sbf 4.2.0
        run: cargo install cargo-build-sbf --version 4.2.0 --force --locked

      - name: Install platform-tools v1.57
        run: cargo build-sbf --tools-version v1.57 --install-only

      - name: Verify toolchain versions
        run: |
          rustc --version
          cargo --version
          solana --version
          anchor --version
          cargo build-sbf --version

      - name: Build Solana program and generate IDL
        run: anchor build --tools-version v1.57 --arch v3

      - name: Run Rust and LiteSVM integration tests
        run: cargo test --workspace --locked
