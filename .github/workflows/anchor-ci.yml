name: Anchor build and tests

on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: anchor-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build Anchor program and run LiteSVM tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: solana-pci
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      -      - name: Install Rust 1.91 for host tools
        run: rustup toolchain install 1.91.0 --profile minimal

      - name: Install Anchor CLI 1.2.2
        run: |
          cargo +1.91.0 install \
            --git https://github.com/otter-sec/anchor \
            --tag v1.2.2 anchor-cli --locked--locked

      - name: Install cargo-build-sbf 4.2.0
        run: cargo install cargo-build-sbf --version 4.2.0 --force --locked

      - name: Install platform-tools v1.57
        run: |
          cargo +1.91.0 install cargo-build-sbf \
            --version 4.2.0 --force --locked

      - name: Verify toolchain versions
        run: |
          rustc --version
          cargo --version
          solana --version
          anchor --version
          cargo build-sbf --version

      - name: Build Solana program and generate IDL
        run: anchor build --tools-version v1.57 --arch v3

      - name: Run Rust and LiteSVM integration tests
        run: cargo test --workspace --locked
